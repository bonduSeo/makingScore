[project]
name = "making-score-wrapper"
version = "0.1.0"
description = "Draft wrapper app that converts MP3 into MIDI/score using AMT pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "pydantic-settings>=2.3.4",
  "authlib>=1.3.1",
  "httpx>=0.27.0",
  "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
